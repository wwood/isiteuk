[workspace]
name = "isiteuk"
version = "0.0.1"
description = "In-situ identification of eukaryotes in metagenomic data"
authors = ["Ben Woodcroft <benjwoodcroft@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[feature.main.dependencies]
python = ">=3.7,<3.12"
singlem = ">=0.16.0"
polars = "0.20.*"
diamond = "==2.1.24"

[feature.main.pypi-dependencies]
isiteuk = {path = ".", editable = true}

[feature.dev.dependencies]
pytest = "*"
zenodo_backpack = ">=0.3"

[environments]
default = ["main"]
dev = ["main", "dev"]

[tasks]
test-base = "pytest test"

[tasks.test]
depends-on = [
    {task = "test-base", environment = "dev"},
]
