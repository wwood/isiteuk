[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "isiteuk"
description = "In-situ identification of eukaryotes in metagenomic data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENCE.txt"]
authors = [
    {name = "Ben Woodcroft", email = "benjwoodcroft@gmail.com"},
]
keywords = ["metagenomics", "bioinformatics", "eukaryotes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.7"
dependencies = [
    "singlem>=0.16.0",
    "polars>=0.20",
    "zenodo_backpack>=0.3",
]
dynamic = ["version"]

[project.scripts]
isiteuk = "isiteuk.main:main"

[project.urls]
Homepage = "https://github.com/wwood/isiteuk"

[tool.setuptools.packages.find]
where = ["."]
include = ["isiteuk*"]

[tool.setuptools_scm]
version_file = "isiteuk/version.py"
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.bird_release]
reminders = [
    "Once the metapackage is on Zenodo: update DATA_DOI in isiteuk/metapackage.py, then release again.",
    "Once on PyPI, submit to bioconda: update sha256 in conda.recipe/meta.yaml and open a PR to bioconda-recipes.",
]
